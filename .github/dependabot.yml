# Grouped so an ecosystem's routine bumps arrive as ONE pull request instead of
# one per dependency. Ungrouped, this fleet reached 1,461 open PRs across 176
# repos, none of which had any CI signal because the only workflow fired on push
# to main.
#
# Majors are deliberately left OUT of the npm group. When the 2026-08-18 backlog
# was landed by hand, 109 bumps had to be held back and they were overwhelmingly
# majors -- a breaking major inside the grouped PR makes the whole thing
# unmergeable, which is the hand-unpicking this exists to prevent. Two worth
# knowing for this lab in particular: typescript 5 -> 7 stops tolerating an
# undeclared side-effect import, so a Vite lab missing src/vite-env.d.ts fails
# with TS2882 on `import './style.css'` (this one has the file); and vitest
# 2 -> 4 makes test timeouts actually enforceable, which matters here because
# the KAT suite signs with SLH-DSA-256s and that single call costs seconds.
#
# github-actions majors ARE grouped: checkout v4->v7, setup-node v4->v7 and the
# Pages v5/v6 jumps were verified green across all 176 repos on 2026-08-18.
#
# Both groups auto-merge once this lab's own gate passes on the PR -- see the
# dependabot-auto-merge job in deploy.yml. That is the same gate the deploy
# runs, deliberately: a bump gated on a lighter workflow than the deploy uses
# can merge cleanly and then break the publish, with nothing red in between.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
