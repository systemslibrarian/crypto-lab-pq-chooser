name: Deploy to GitHub Pages

# ONE workflow, on purpose. The gate a Dependabot bump auto-merges against has
# to be the gate the deploy runs: where auto-merge is gated on a lighter CI
# workflow, a bump that breaks the heavier gate merges cleanly and then the
# deploy fails, so main silently stops shipping with nothing red in between.
# crypto-lab-e91 drifted exactly that way.

on:
  push:
    branches: [main]
  pull_request:          # the gate must judge PRs too
    branches: [main]
  workflow_dispatch:     # so the auto-merge job can dispatch a deploy by hand

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # NOT a bare `pages`: with cancel-in-progress, a pull-request run would cancel
  # a live main deploy.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The measured local run is about four minutes, dominated by SLH-DSA signing
    # in the KAT suite and by the browser gate driving a full derivation four
    # times. GitHub's default job limit is 360 minutes, which is where a hung
    # job burning six hours with nothing red comes from.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The WHOLE suite, not just the a11y half. A 2026-08-14 sweep found 29
      # repos whose deploy ran `test:a11y` alone, so their cryptographic suites
      # never blocked a publish.
      - name: Unit tests (Vitest, incl. FIPS 203/204/205 and Falcon KATs)
        run: npm test

      - name: Build (typecheck gates the build)
        run: npm run build

      - name: Install Playwright browsers
        # Deliberately NOT `--with-deps`. That apt step wedged 547 runs across
        # this fleet; ubuntu-latest already carries what headless Chromium and
        # Firefox need. WebKit is NOT installed here for the same reason -- it
        # is the one engine that genuinely requires those system packages -- so
        # its smoke project runs locally (`npm run test:smoke:webkit`) and the
        # gap is stated in the README rather than papered over.
        run: npx playwright install chromium firefox

      - name: Accessibility gate (axe-core, WCAG A/AA, desktop and 380px)
        run: npm run test:a11y

      - name: Claims suite (the page tells the truth, incl. the negative claim)
        run: npm run test:claims

      - name: Layout gate (first viewport, phone matrix, anchor offsets)
        run: npm run test:layout

      - name: Cross-engine smoke (Chromium + Firefox)
        run: npm run test:smoke

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    # NOT `== 'push'`. They read as equivalent and are not: `== 'push'` also
    # skips workflow_dispatch, which is the one trigger the auto-merge job below
    # depends on -- the dispatched run would build, pass the gate, and skip this
    # job, so the site would still never update.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # What the gate above cannot see: the DEPLOYED artefact. `vite preview` and
  # GitHub Pages serve the project subpath and the module worker differently
  # enough that a wrong `base` or a worker chunk that 404s is green locally and
  # broken live -- and the failure is silent, because the page renders and then
  # simply never derives anything. This drives the real URL after publishing.
  smoke:
    needs: deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Smoke the published site
        env:
          PQ_CHOOSER_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npm run test:smoke:live

  # Dependabot only. `needs: build` is the whole safety argument: the gate
  # decides, not the version number. A major that actually breaks this lab fails
  # the gate and the pull request stays open for a human.
  dependabot-auto-merge:
    needs: build
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # actions: write is required for the deploy dispatch below. Without it
      # `gh workflow run` returns HTTP 403 "Resource not accessible by
      # integration", the merged bump never deploys, and a `|| echo` fallback
      # hides it.
      actions: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      - name: Merge any bump whose gate went green
        run: |
          merged=""
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              merged=1
              break
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15          # a sibling PR merging first moves main under us
          done
          if [ -z "$merged" ]; then
            echo "::warning::gate passed, merge did not land after 3 attempts;"
            echo "::warning::leaving this PR open - Dependabot will rebase and retry."
            exit 0
          fi
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          #
          # Dispatch the file THIS lab has: most are deploy.yml, some deploy-pages.yml
          # or pages.yml. A copied name 404s only on the auto-merge path, after the
          # merge has landed. This lab's file is deploy.yml, which is this one.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main \
            || echo "::warning::deploy dispatch failed; run deploy.yml by hand"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
